<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">How the two-hidden-layer network trains</title>
  <desc id="description">A visual walkthrough of one mini-batch gradient-descent update for the project's breast-cancer multilayer perceptron: shuffle a batch, run the forward pass through ReLU hidden layers and two softmax outputs, compute categorical cross-entropy, backpropagate gradients, update weights and biases, then repeat for every batch and epoch.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .heading { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Arial, sans-serif; fill: #475569; }
      .section { font: 700 19px Inter, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, Arial, sans-serif; fill: #64748b; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #64748b; }
      .math { font: 600 16px 'SFMono-Regular', Consolas, monospace; fill: #0f172a; }
      .math-small { font: 600 13px 'SFMono-Regular', Consolas, monospace; fill: #0f172a; }
      .step { font: 700 13px Inter, Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>
  <rect x="32" y="28" width="1536" height="118" rx="22" fill="url(#header)"/>
  <rect x="64" y="56" width="130" height="32" rx="16" fill="#d1fae5"/>
  <text x="129" y="78" text-anchor="middle" class="label" style="fill:#047857">TRAINING EXAMPLE</text>
  <text x="64" y="118" class="heading">How one mini-batch teaches the network</text>
  <text x="64" y="141" class="subtitle">Training repeatedly compares a prediction with the known diagnosis, sends the error backward, and makes a small correction to every weight and bias.</text>

  <!-- Preparation ribbon -->
  <rect x="32" y="170" width="1536" height="100" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="79" cy="220" r="17" fill="#2563eb"/><text x="79" y="220" class="step">0</text>
  <text x="110" y="211" class="section">Prepare data once</text>
  <text x="110" y="235" class="small">Load rows → split (default: 80% train / 20% test) → fit Min-Max scaling on the training portion → save the scaler.</text>
  <rect x="1093" y="194" width="426" height="51" rx="14" fill="#eff6ff"/>
  <text x="1115" y="216" class="label" style="fill:#1d4ed8">Training input</text>
  <text x="1115" y="236" class="small">X: 30 scaled features · y: M → [0, 1], B → [1, 0]</text>

  <!-- Main mini-batch panel -->
  <rect x="32" y="296" width="1536" height="446" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="64" y="335" class="section">One mini-batch update</text>
  <text x="64" y="358" class="small">The default command uses a batch size of 8. The last batch may contain fewer rows.</text>

  <!-- Flow arrows under all cards -->
  <path d="M307 502 H357" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M599 502 H649" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M905 502 H955" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M1207 502 H1257" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="64" y="389" width="243" height="230" rx="20" fill="#eff6ff"/>
  </g>
  <circle cx="91" cy="416" r="16" fill="#2563eb"/><text x="91" y="416" class="step">1</text>
  <text x="119" y="421" class="section" style="font-size:17px;fill:#1d4ed8">Shuffle and slice</text>
  <text x="88" y="451" class="small">Choose 8 random training rows.</text>
  <g>
    <rect x="88" y="472" width="104" height="100" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <path d="M88 497 H192 M88 522 H192 M88 547 H192 M122 472 V572 M157 472 V572" stroke="#bfdbfe"/>
    <rect x="89" y="473" width="33" height="24" fill="#bfdbfe"/><rect x="123" y="498" width="34" height="24" fill="#dbeafe"/>
    <rect x="158" y="523" width="33" height="24" fill="#bfdbfe"/>
    <text x="140" y="589" text-anchor="middle" class="tiny">X_batch (8 × 30)</text>
    <rect x="211" y="472" width="55" height="100" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <path d="M211 497 H266 M211 522 H266 M211 547 H266" stroke="#bfdbfe"/>
    <text x="238" y="490" text-anchor="middle" class="tiny">[0, 1]</text><text x="238" y="515" text-anchor="middle" class="tiny">[1, 0]</text>
    <text x="238" y="540" text-anchor="middle" class="tiny">[0, 1]</text><text x="238" y="565" text-anchor="middle" class="tiny">…</text>
    <text x="238" y="589" text-anchor="middle" class="tiny">y (8 × 2)</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="357" y="389" width="242" height="230" rx="20" fill="#eef2ff"/>
  </g>
  <circle cx="384" cy="416" r="16" fill="#4f46e5"/><text x="384" y="416" class="step">2</text>
  <text x="412" y="421" class="section" style="font-size:17px;fill:#4338ca">Forward pass</text>
  <text x="381" y="451" class="small">Pass every row through the same</text>
  <text x="381" y="470" class="small">learned network.</text>
  <g>
    <circle cx="395" cy="508" r="9" fill="#2563eb"/><circle cx="395" cy="536" r="9" fill="#2563eb"/><circle cx="395" cy="564" r="9" fill="#2563eb"/>
    <path d="M407 508 L456 500 M407 508 L456 530 M407 536 L456 500 M407 536 L456 530 M407 564 L456 500 M407 564 L456 530" stroke="#a5b4fc"/>
    <circle cx="465" cy="500" r="14" fill="#7c3aed"/><circle cx="465" cy="530" r="14" fill="#7c3aed"/>
    <path d="M479 500 L525 515 M479 530 L525 515" stroke="#a5b4fc"/>
    <circle cx="538" cy="501" r="14" fill="#ea580c"/><circle cx="538" cy="529" r="14" fill="#ea580c"/>
    <text x="395" y="594" text-anchor="middle" class="tiny">30</text><text x="465" y="594" text-anchor="middle" class="tiny">24 → 24</text><text x="538" y="594" text-anchor="middle" class="tiny">2</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="649" y="389" width="256" height="230" rx="20" fill="#fff7ed"/>
  </g>
  <circle cx="676" cy="416" r="16" fill="#ea580c"/><text x="676" y="416" class="step">3</text>
  <text x="704" y="421" class="section" style="font-size:17px;fill:#c2410c">Measure the error</text>
  <text x="673" y="451" class="small">Compare a softmax row p with one-hot y.</text>
  <rect x="674" y="474" width="121" height="61" rx="10" fill="#ffffff" stroke="#fed7aa"/>
  <text x="734" y="498" text-anchor="middle" class="tiny">softmax p</text>
  <text x="734" y="522" text-anchor="middle" style="font:700 16px Inter,Arial,sans-serif;fill:#c2410c">[.16, .84]</text>
  <text x="804" y="511" class="math" style="fill:#c2410c">vs.</text>
  <rect x="834" y="474" width="58" height="61" rx="10" fill="#ffffff" stroke="#fed7aa"/>
  <text x="863" y="498" text-anchor="middle" class="tiny">y</text>
  <text x="863" y="522" text-anchor="middle" style="font:700 13px Inter,Arial,sans-serif;fill:#c2410c">[0, 1]</text>
  <text x="673" y="558" class="math-small">CCE = −mean(sum(y × log(p)))</text>
  <text x="673" y="578" class="math-small">p has one probability per class</text>
  <text x="673" y="599" class="tiny">Small loss means predictions are</text>
  <text x="673" y="614" class="tiny">closer to the true labels.</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="955" y="389" width="252" height="230" rx="20" fill="#fef2f2"/>
  </g>
  <circle cx="982" cy="416" r="16" fill="#dc2626"/><text x="982" y="416" class="step">4</text>
  <text x="1010" y="421" class="section" style="font-size:17px;fill:#b91c1c">Backpropagate</text>
  <text x="979" y="451" class="small">Send the error backward through</text>
  <text x="979" y="470" class="small">the output and both ReLU layers.</text>
  <path d="M1164 517 H1006" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#arrow-red)"/>
  <text x="1085" y="505" text-anchor="middle" class="label" style="fill:#b91c1c">gradients move left</text>
  <text x="979" y="555" class="math-small">dZ³ = p − y_one_hot</text>
  <text x="979" y="580" class="math-small">dW = Aᵀ dZ / batch_size</text>
  <text x="979" y="599" class="tiny">ReLU passes gradients only where</text>
  <text x="979" y="614" class="tiny">its input was positive.</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="1257" y="389" width="247" height="230" rx="20" fill="#ecfdf5"/>
  </g>
  <circle cx="1284" cy="416" r="16" fill="#059669"/><text x="1284" y="416" class="step">5</text>
  <text x="1312" y="421" class="section" style="font-size:17px;fill:#047857">Update parameters</text>
  <text x="1281" y="451" class="small">Nudge all weights and biases</text>
  <text x="1281" y="470" class="small">in the error-reducing direction.</text>
  <rect x="1281" y="494" width="198" height="53" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="1380" y="518" text-anchor="middle" class="math-small">W ← W − η dW</text>
  <text x="1380" y="538" text-anchor="middle" class="math-small">b ← b − η db</text>
  <text x="1281" y="575" class="label" style="fill:#047857">η = 0.0314 by default</text>
  <text x="1281" y="599" class="tiny">Then begin the next mini-batch with</text>
  <text x="1281" y="614" class="tiny">the updated model.</text>

  <!-- Repeat loop -->
  <path d="M1381 644 V681 H186 V644" stroke="#059669" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="635" y="657" width="331" height="46" rx="23" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="800" y="685" text-anchor="middle" class="label" style="fill:#047857">Repeat steps 1–5 until every training row is used</text>

  <!-- Epoch and code example section -->
  <rect x="32" y="770" width="1536" height="226" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="64" y="809" class="section">From mini-batches to a trained model</text>
  <text x="64" y="832" class="small">After all batches in one epoch, the project evaluates the training data and appends loss and accuracy to its history.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="857" width="359" height="108" rx="18" fill="#eff6ff"/>
    <rect x="447" y="857" width="359" height="108" rx="18" fill="#f5f3ff"/>
    <rect x="830" y="857" width="674" height="108" rx="18" fill="#f8fafc"/>
  </g>
  <g>
    <circle cx="92" cy="884" r="15" fill="#2563eb"/><text x="92" y="884" class="step">A</text>
    <text x="119" y="889" class="label" style="fill:#1d4ed8">Finish one epoch</text>
    <text x="88" y="917" class="math-small">all training rows → loss, accuracy</text>
    <text x="88" y="943" class="tiny">Metrics show whether the model is improving.</text>

    <circle cx="475" cy="884" r="15" fill="#7c3aed"/><text x="475" y="884" class="step">B</text>
    <text x="502" y="889" class="label" style="fill:#6d28d9">Start the next epoch</text>
    <text x="471" y="917" class="math-small">shuffle again → new batch order</text>
    <text x="471" y="943" class="tiny">The default example repeats this for 84 epochs.</text>

    <text x="855" y="886" class="label">Example command for this exact architecture</text>
    <rect x="854" y="897" width="625" height="50" rx="9" fill="#0f172a"/>
    <text x="872" y="918" style="font:600 12px 'SFMono-Regular',Consolas,monospace;fill:#e2e8f0">python mlp.py --train --layer 24 24 --epochs 84</text>
    <text x="872" y="937" style="font:600 12px 'SFMono-Regular',Consolas,monospace;fill:#e2e8f0">--batch_size 8 --learning_rate 0.0314</text>
    <text x="855" y="962" class="tiny">A fixed seed (42 by default) makes the initial weights and batch shuffle reproducible.</text>
  </g>

  <text x="64" y="1024" class="tiny">Color key: blue = data/forward pass · orange = loss · red = gradients/backpropagation · green = parameter update.</text>
</svg>
