<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">A multilayer perceptron with two hidden layers</title>
  <desc id="description">Thirty scaled input features feed two fully connected ReLU hidden layers with 24 neurons each. Two softmax output neurons return probabilities for benign and malignant diagnoses.</desc>
  <defs>
    <style>
      .heading { font: 700 28px Arial, sans-serif; fill: #102a43; }
      .subheading { font: 400 16px Arial, sans-serif; fill: #486581; }
      .label { font: 700 17px Arial, sans-serif; fill: #102a43; }
      .detail { font: 400 14px Arial, sans-serif; fill: #486581; }
      .small { font: 400 13px Arial, sans-serif; fill: #627d98; }
      .connection { stroke: #b8c9d9; stroke-width: 1.4; opacity: .9; }
      .node-input { fill: #d9efff; stroke: #2677b8; stroke-width: 2; }
      .node-hidden-one { fill: #dcecff; stroke: #3170b7; stroke-width: 2; }
      .node-hidden-two { fill: #eee5ff; stroke: #7650b4; stroke-width: 2; }
      .node-output { fill: #d8f4e5; stroke: #22865b; stroke-width: 2.5; }
      .panel { fill: #f8fbfe; stroke: #d7e2ec; stroke-width: 1.5; }
      .formula { font: 600 15px 'Courier New', monospace; fill: #243b53; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#627d98"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="heading">Two-hidden-layer neural network</text>
  <text x="600" y="76" text-anchor="middle" class="subheading">Example used by this project: <tspan font-family="'Courier New', monospace">--layer 24 24</tspan></text>

  <!-- Column labels -->
  <text x="130" y="122" text-anchor="middle" class="label">Input layer</text>
  <text x="130" y="146" text-anchor="middle" class="detail">30 scaled features</text>
  <text x="425" y="122" text-anchor="middle" class="label">Hidden layer 1</text>
  <text x="425" y="146" text-anchor="middle" class="detail">24 neurons · ReLU</text>
  <text x="715" y="122" text-anchor="middle" class="label">Hidden layer 2</text>
  <text x="715" y="146" text-anchor="middle" class="detail">24 neurons · ReLU</text>
  <text x="1015" y="122" text-anchor="middle" class="label">Output layer</text>
  <text x="1015" y="146" text-anchor="middle" class="detail">2 neurons · softmax</text>

  <!-- Representative full connections: input to hidden 1 -->
  <g class="connection">
    <path d="M148 212 L401 212"/><path d="M148 212 L401 282"/><path d="M148 212 L401 352"/><path d="M148 212 L401 422"/>
    <path d="M148 282 L401 212"/><path d="M148 282 L401 282"/><path d="M148 282 L401 352"/><path d="M148 282 L401 422"/>
    <path d="M148 352 L401 212"/><path d="M148 352 L401 282"/><path d="M148 352 L401 352"/><path d="M148 352 L401 422"/>
    <path d="M148 422 L401 212"/><path d="M148 422 L401 282"/><path d="M148 422 L401 352"/><path d="M148 422 L401 422"/>
  </g>
  <!-- Representative full connections: hidden 1 to hidden 2 -->
  <g class="connection">
    <path d="M449 212 L691 212"/><path d="M449 212 L691 282"/><path d="M449 212 L691 352"/><path d="M449 212 L691 422"/>
    <path d="M449 282 L691 212"/><path d="M449 282 L691 282"/><path d="M449 282 L691 352"/><path d="M449 282 L691 422"/>
    <path d="M449 352 L691 212"/><path d="M449 352 L691 282"/><path d="M449 352 L691 352"/><path d="M449 352 L691 422"/>
    <path d="M449 422 L691 212"/><path d="M449 422 L691 282"/><path d="M449 422 L691 352"/><path d="M449 422 L691 422"/>
  </g>
  <!-- Hidden 2 to both softmax outputs -->
  <g class="connection">
    <path d="M739 212 L982 282"/><path d="M739 212 L982 392"/>
    <path d="M739 282 L982 282"/><path d="M739 282 L982 392"/>
    <path d="M739 352 L982 282"/><path d="M739 352 L982 392"/>
    <path d="M739 422 L982 282"/><path d="M739 422 L982 392"/>
  </g>

  <!-- Input nodes -->
  <g class="node-input">
    <circle cx="130" cy="212" r="18"/><circle cx="130" cy="282" r="18"/><circle cx="130" cy="352" r="18"/><circle cx="130" cy="422" r="18"/>
  </g>
  <text x="96" y="217" text-anchor="end" class="small">radius_mean</text>
  <text x="96" y="287" text-anchor="end" class="small">texture_mean</text>
  <text x="96" y="357" text-anchor="end" class="small">…</text>
  <text x="96" y="427" text-anchor="end" class="small">worst_feature</text>
  <text x="130" y="505" text-anchor="middle" class="small">Each row is one patient.</text>

  <!-- First hidden layer -->
  <g class="node-hidden-one">
    <circle cx="425" cy="212" r="24"/><circle cx="425" cy="282" r="24"/><circle cx="425" cy="352" r="24"/><circle cx="425" cy="422" r="24"/>
  </g>
  <text x="425" y="217" text-anchor="middle" class="detail">h₁</text>
  <text x="425" y="287" text-anchor="middle" class="detail">h₂</text>
  <text x="425" y="357" text-anchor="middle" class="detail">⋮</text>
  <text x="425" y="427" text-anchor="middle" class="detail">h₂₄</text>
  <text x="425" y="505" text-anchor="middle" class="small">Learns simple combinations</text>
  <text x="425" y="525" text-anchor="middle" class="small">of the input features.</text>

  <!-- Second hidden layer -->
  <g class="node-hidden-two">
    <circle cx="715" cy="212" r="24"/><circle cx="715" cy="282" r="24"/><circle cx="715" cy="352" r="24"/><circle cx="715" cy="422" r="24"/>
  </g>
  <text x="715" y="217" text-anchor="middle" class="detail">h₁</text>
  <text x="715" y="287" text-anchor="middle" class="detail">h₂</text>
  <text x="715" y="357" text-anchor="middle" class="detail">⋮</text>
  <text x="715" y="427" text-anchor="middle" class="detail">h₂₄</text>
  <text x="715" y="505" text-anchor="middle" class="small">Combines the first layer's</text>
  <text x="715" y="525" text-anchor="middle" class="small">patterns into richer patterns.</text>

  <!-- Softmax output -->
  <circle cx="1015" cy="282" r="39" class="node-output"/>
  <circle cx="1015" cy="392" r="39" class="node-output"/>
  <text x="1015" y="277" text-anchor="middle" class="label">p(B)</text>
  <text x="1015" y="298" text-anchor="middle" class="detail">benign</text>
  <text x="1015" y="387" text-anchor="middle" class="label">p(M)</text>
  <text x="1015" y="408" text-anchor="middle" class="detail">malignant</text>
  <text x="1015" y="463" text-anchor="middle" class="small">softmax probabilities sum to 1</text>
  <text x="1015" y="483" text-anchor="middle" class="small">largest probability → predicted class</text>

  <!-- How a neuron works -->
  <rect x="75" y="560" width="1050" height="62" rx="10" class="panel"/>
  <path d="M246 591 L300 591" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M589 591 L643 591" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M884 591 L938 591" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="587" text-anchor="middle" class="formula">inputs</text>
  <text x="160" y="608" text-anchor="middle" class="small">values from prior layer</text>
  <text x="445" y="587" text-anchor="middle" class="formula">Z = inputs × W + b</text>
  <text x="445" y="608" text-anchor="middle" class="small">weighted sum + bias</text>
  <text x="735" y="587" text-anchor="middle" class="formula">A = activation(Z)</text>
  <text x="735" y="608" text-anchor="middle" class="small">ReLU in hidden layers</text>
  <text x="1030" y="587" text-anchor="middle" class="formula">next layer</text>
  <text x="1030" y="608" text-anchor="middle" class="small">softmax at the output</text>
</svg>
